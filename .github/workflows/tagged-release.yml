name: Tagged Release

on:
  push:
    tags:
      - "v*"

jobs:
  pre-release:
    runs-on: ubuntu-22.04
    name: Publish Release ${{github.ref}}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
